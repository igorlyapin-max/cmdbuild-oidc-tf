name: cmdbuild-oidc-tf

services:
  oidc-edge:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: cmdbuild-oidc-tf-edge
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./compose/nginx-edge.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      NGINX_ENVSUBST_FILTER: OPENWEBUI_PUBLIC_PORT|ZITADEL_PUBLIC_PORT|MCP_PUBLIC_PORT
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${MCP_PUBLIC_PORT:-8085}/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  cmdbuild-db:
    image: postgis/postgis:17-3.5-alpine@sha256:4bb8f0bd9156c9c4dbe80056f9d8a1b9bd0cbf39465013bf5e60157ecee3c1f7
    container_name: cmdbuild-oidc-tf-cmdbuild-db
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/cmdbuild-oidc-tf-postgres-entrypoint"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: ${CMDBUILD_DB_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/cmdbuild_db_password
    ports:
      - "127.0.0.1:${CMDBUILD_DB_PORT:-15434}:5432"
    volumes:
      - cmdbuild_db:/var/lib/postgresql/data
      - ./compose/postgres-init-app-role.sh:/docker-entrypoint-initdb.d/20-cmdbuild-oidc-tf-app-role.sh:ro
      - ./compose/postgres-entrypoint.sh:/usr/local/bin/cmdbuild-oidc-tf-postgres-entrypoint:ro
    secrets:
      - cmdbuild_db_password
      - cmdbuild_app_password
    networks: [cmdbuild]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  cmdbuild:
    build:
      context: .
      dockerfile: compose/Dockerfile.cmdbuild-bearer
    image: cmdbuild-oidc-tf-cmdbuild:4.2.0-bearer.1
    container_name: cmdbuild-oidc-tf-cmdbuild
    restart: unless-stopped
    user: "0:0"
    depends_on:
      cmdbuild-db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${CMDBUILD_DB_USER:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_HOST: cmdbuild-db
      POSTGRES_DB: ${CMDBUILD_DB_NAME:-cmdbuild_oidc_tf}
      CMDBUILD_DUMP: ${CMDBUILD_DUMP:-demo.dump.xz}
      JAVA_OPTS: ${CMDBUILD_JAVA_OPTS:--Xms1024m -Xmx2048m}
      CMDBUILD_BEARER_ENABLED: ${CMDBUILD_BEARER_ENABLED:-false}
      CMDBUILD_BEARER_ISSUER: ${CMDBUILD_BEARER_ISSUER:-http://${PUBLIC_HOST:-192.168.202.35}:${ZITADEL_PUBLIC_PORT:-8084}}
      CMDBUILD_BEARER_JWKS_URL: ${CMDBUILD_BEARER_JWKS_URL:-http://${PUBLIC_HOST:-192.168.202.35}:${ZITADEL_PUBLIC_PORT:-8084}/oauth/v2/keys}
      CMDBUILD_BEARER_AUDIENCE: ${CMDBUILD_RESOURCE_AUDIENCE:-replace-with-cmdbuild-resource-project-id}
      CMDBUILD_RESOURCE_AUDIENCE: ${CMDBUILD_RESOURCE_AUDIENCE:-replace-with-cmdbuild-resource-project-id}
      CMDBUILD_BEARER_USER_CLAIM: ${CMDBUILD_BEARER_USER_CLAIM:-sub}
      CMDBUILD_BEARER_CLOCK_SKEW_SECONDS: ${CMDBUILD_BEARER_CLOCK_SKEW_SECONDS:-30}
      CMDBUILD_BEARER_ALLOWED_JWS_ALGORITHM: ${CMDBUILD_BEARER_ALLOWED_JWS_ALGORITHM:-RS256}
      CMDBUILD_BEARER_AUDIT_SINK_URL: ${CMDBUILD_BEARER_AUDIT_SINK_URL:-http://log-collector:18101/v1/logs}
      CMDBUILD_BEARER_AUDIT_HMAC_KEY_FILE: /run/secrets/log_collector_hmac_key
      CMDBUILD_BEARER_DIAGNOSTIC_LEVEL: ${CMDBUILD_BEARER_DIAGNOSTIC_LEVEL:-off}
    ports:
      - "${CMDBUILD_BIND_HOST:-127.0.0.1}:${CMDBUILD_HTTP_PORT:-18090}:8080"
    volumes:
      - ./compose/cmdbuild-entrypoint.sh:/usr/local/bin/cmdbuild-oidc-tf-cmdbuild-entrypoint:ro
    secrets:
      - cmdbuild_db_password
      - cmdbuild_app_password
      - cmdbuild_oidc_tf_client_id
      - cmdbuild_oidc_tf_client_secret
      - log_collector_hmac_key
    entrypoint: ["/usr/local/bin/cmdbuild-oidc-tf-cmdbuild-entrypoint"]
    networks: [cmdbuild]
    healthcheck:
      test: ["CMD", "curl", "-f", "-L", "http://localhost:8080/cmdbuild/ui"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 180s

  cmdbuild-db-patch:
    image: cmdbuild-oidc-tf-cmdbuild:4.2.0-bearer.1
    container_name: cmdbuild-oidc-tf-cmdbuild-db-patch
    profiles: ["maintenance"]
    user: "0:0"
    restart: "no"
    depends_on:
      cmdbuild-db:
        condition: service_healthy
    networks: [cmdbuild]
    environment:
      POSTGRES_USER: ${CMDBUILD_DB_USER:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_HOST: cmdbuild-db
      POSTGRES_DB: ${CMDBUILD_DB_NAME:-cmdbuild_oidc_tf}
    volumes:
      - ./compose/cmdbuild-db-patch.sh:/usr/local/bin/cmdbuild-oidc-tf-cmdbuild-db-patch:ro
    secrets:
      - cmdbuild_db_password
      - cmdbuild_app_password
    entrypoint: ["/usr/local/bin/cmdbuild-oidc-tf-cmdbuild-db-patch"]

  log-collector-permissions:
    image: cmdbuild-oidc-tf:local
    container_name: cmdbuild-oidc-tf-log-collector-permissions
    user: "0:0"
    restart: "no"
    command:
      - sh
      - -ec
      - >-
        mkdir -p /var/lib/cmdbuild-oidc-tf-logs &&
        chown -R node:node /var/lib/cmdbuild-oidc-tf-logs &&
        chmod 700 /var/lib/cmdbuild-oidc-tf-logs &&
        find /var/lib/cmdbuild-oidc-tf-logs -type f -exec chmod 600 {} +
    volumes:
      - logs:/var/lib/cmdbuild-oidc-tf-logs
    networks: [cmdbuild]

  log-collector:
    build: .
    image: cmdbuild-oidc-tf:local
    container_name: cmdbuild-oidc-tf-log-collector
    restart: unless-stopped
    depends_on:
      log-collector-permissions:
        condition: service_completed_successfully
    command: ["node", "dist/src/log-collector.js"]
    environment:
      LOG_COLLECTOR_PORT: ${LOG_COLLECTOR_PORT:-18101}
      LOG_DIRECTORY: /var/lib/cmdbuild-oidc-tf-logs
      LOG_COLLECTOR_HMAC_KEY_FILE: /run/secrets/log_collector_hmac_key
      DIAGNOSTIC_LEVEL: ${DIAGNOSTIC_LEVEL:-basic}
    ports:
      - "127.0.0.1:${LOG_COLLECTOR_PORT:-18101}:18101"
    volumes:
      - logs:/var/lib/cmdbuild-oidc-tf-logs
    secrets:
      - log_collector_hmac_key
    networks: [cmdbuild]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${LOG_COLLECTOR_PORT:-18101}/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mcp-gateway:
    build: .
    image: cmdbuild-oidc-tf:local
    container_name: cmdbuild-oidc-tf-mcp-gateway
    network_mode: host
    restart: unless-stopped
    depends_on:
      log-collector:
        condition: service_healthy
      cmdbuild:
        condition: service_healthy
    command: ["node", "dist/src/gateway.js"]
    environment:
      MCP_GATEWAY_PORT: ${MCP_GATEWAY_PORT:-18100}
      MCP_PUBLIC_URL: http://${PUBLIC_HOST:-192.168.202.35}:${MCP_PUBLIC_PORT:-8085}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://192.168.202.35:8084}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://${PUBLIC_HOST:-192.168.202.35}:${ZITADEL_PUBLIC_PORT:-8084}/oauth/v2/keys}
      OIDC_USERINFO_URL: ${OIDC_USERINFO_URL:-http://${PUBLIC_HOST:-192.168.202.35}:${ZITADEL_PUBLIC_PORT:-8084}/oidc/v1/userinfo}
      CMDBUILD_RESOURCE_PROJECT_ID: ${CMDBUILD_RESOURCE_PROJECT_ID:-replace-with-cmdbuild-resource-project-id}
      CMDBUILD_RESOURCE_AUDIENCE: ${CMDBUILD_RESOURCE_AUDIENCE:-replace-with-cmdbuild-resource-project-id}
      GROUP_CLAIM_NAME: ${GROUP_CLAIM_NAME:-cmdbuild_oidc_tf_groups}
      GROUP_ADMIN: ${GROUP_ADMIN:-admin}
      GROUP_EDITOR: ${GROUP_EDITOR:-editor}
      GROUP_READER: ${GROUP_READER:-reader}
      CMDBUILD_BASE_URL: ${CMDBUILD_BASE_URL:-http://${PUBLIC_HOST:-192.168.202.35}:${CMDBUILD_HTTP_PORT:-18090}}
      CMDBUILD_DEMO_CLASS: ${CMDBUILD_DEMO_CLASS:-Building}
      CMDBUILD_DEMO_CARD_ID: ${CMDBUILD_DEMO_CARD_ID:-}
      CMDBUILD_WRITABLE_ATTRIBUTES: ${CMDBUILD_WRITABLE_ATTRIBUTES:-Description,Notes}
      LOG_SINK_URL: http://127.0.0.1:${LOG_COLLECTOR_PORT:-18101}/v1/logs
      LOG_SINK_HMAC_KEY_FILE: /run/secrets/log_collector_hmac_key
      DIAGNOSTIC_LEVEL: ${DIAGNOSTIC_LEVEL:-basic}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-poc-http}
      ALLOWED_HOSTS: ${PUBLIC_HOST:-192.168.202.35},127.0.0.1,localhost
      MCP_MAX_SESSIONS: ${MCP_MAX_SESSIONS:-500}
      MCP_MAX_SESSIONS_PER_SUBJECT: ${MCP_MAX_SESSIONS_PER_SUBJECT:-10}
    secrets:
      - log_collector_hmac_key
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${MCP_GATEWAY_PORT:-18100}/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  cmdb-oidc-bff:
    build: .
    image: cmdbuild-oidc-tf:local
    container_name: cmdbuild-oidc-tf-cmdb-oidc-bff
    network_mode: host
    restart: unless-stopped
    depends_on:
      log-collector:
        condition: service_healthy
      cmdbuild:
        condition: service_healthy
    command: ["node", "dist/src/bff.js"]
    environment:
      BFF_PORT: ${BFF_PORT:-18086}
      BFF_CLIENT_ID: ${BFF_CLIENT_ID:-replace-with-zitadel-bff-client-id}
      BFF_REDIRECT_URI: ${BFF_REDIRECT_URI:-http://192.168.202.35:18086/oauth/callback}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://192.168.202.35:8084}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://${PUBLIC_HOST:-192.168.202.35}:${ZITADEL_PUBLIC_PORT:-8084}/oauth/v2/keys}
      CMDBUILD_RESOURCE_PROJECT_ID: ${CMDBUILD_RESOURCE_PROJECT_ID:-replace-with-cmdbuild-resource-project-id}
      CMDBUILD_RESOURCE_AUDIENCE: ${CMDBUILD_RESOURCE_AUDIENCE:-replace-with-cmdbuild-resource-project-id}
      CMDBUILD_BASE_URL: ${CMDBUILD_BASE_URL:-http://${PUBLIC_HOST:-192.168.202.35}:${CMDBUILD_HTTP_PORT:-18090}}
      GROUP_CLAIM_NAME: ${GROUP_CLAIM_NAME:-cmdbuild_oidc_tf_groups}
      GROUP_ADMIN: ${GROUP_ADMIN:-admin}
      GROUP_EDITOR: ${GROUP_EDITOR:-editor}
      GROUP_READER: ${GROUP_READER:-reader}
      CMDBUILD_DEMO_CLASS: ${CMDBUILD_DEMO_CLASS:-Building}
      CMDBUILD_DEMO_CARD_ID: ${CMDBUILD_DEMO_CARD_ID:-}
      CMDBUILD_WRITABLE_ATTRIBUTES: ${CMDBUILD_WRITABLE_ATTRIBUTES:-Description,Notes}
      BFF_POC_WRITE_ENABLED: ${BFF_POC_WRITE_ENABLED:-false}
      LOG_SINK_URL: http://127.0.0.1:${LOG_COLLECTOR_PORT:-18101}/v1/logs
      LOG_SINK_HMAC_KEY_FILE: /run/secrets/log_collector_hmac_key
      DIAGNOSTIC_LEVEL: ${DIAGNOSTIC_LEVEL:-basic}
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-poc-http}
      ALLOWED_HOSTS: ${PUBLIC_HOST:-192.168.202.35},127.0.0.1,localhost
      BFF_MAX_PENDING_LOGINS: ${BFF_MAX_PENDING_LOGINS:-1000}
      BFF_MAX_BROWSER_SESSIONS: ${BFF_MAX_BROWSER_SESSIONS:-2000}
      BFF_LOGIN_RATE_LIMIT_PER_MINUTE: ${BFF_LOGIN_RATE_LIMIT_PER_MINUTE:-30}
    secrets:
      - log_collector_hmac_key
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${BFF_PORT:-18086}/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  cmdbuild:
    name: cmdbuild-oidc-tf-cmdbuild

volumes:
  cmdbuild_db:
    name: cmdbuild-oidc-tf_cmdbuild_db
    external: true
  logs:
    name: cmdbuild-oidc-tf_logs
    external: true

secrets:
  cmdbuild_db_password:
    file: ${CMDBUILD_DB_PASSWORD_FILE:-./secrets/cmdbuild_db_password}
  cmdbuild_app_password:
    file: ${CMDBUILD_APP_PASSWORD_FILE:-./secrets/cmdbuild_app_password}
  cmdbuild_oidc_tf_client_id:
    file: ${CMDBUILD_OIDC_CLIENT_ID_FILE:-./secrets/cmdbuild_oidc_tf_client_id}
  cmdbuild_oidc_tf_client_secret:
    file: ${CMDBUILD_OIDC_CLIENT_SECRET_FILE:-./secrets/cmdbuild_oidc_tf_client_secret}
  log_collector_hmac_key:
    file: ${LOG_COLLECTOR_HMAC_KEY_FILE:-./secrets/log_collector_hmac_key}
